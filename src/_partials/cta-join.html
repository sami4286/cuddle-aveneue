<!-- ════════════════════ CLOSING CTA ════════════════════
     The homepage's enrolment card, now the closing section on every
     page in the site. One source: the swooshes, the card, the two
     contact rows and the layout live here, and each page supplies
     only its own words through @var.

     Every page that includes this must declare all seven variables, 
     the assembler fails the build on an unfilled variable,
     which is exactly the behaviour we want for a call to action.

       CTA_EYEBROW    the small line above the title
       CTA_TITLE      the big line; may carry <br class="c2-lb">
       CTA_LEAD       one sentence on the right
       CTA_BTN1_HREF  primary button
       CTA_BTN1
       CTA_BTN2_HREF  secondary button
       CTA_BTN2
     ================================================================ -->
<section class="c2-join" id="enroll" aria-labelledby="cta-join-title">
  <div class="c2-shell">
    <div class="c2-join__card">

      <svg class="c2-join__arcs" viewBox="0 0 1740 648" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
        <g fill="none" stroke="rgba(255,255,255,.11)" stroke-width="11" stroke-linecap="round">
          <path d="M760 430 C 800 205, 1060 148, 1300 330 C 1485 468, 1625 552, 1790 665"/>
          <path d="M550 648 A 300 300 0 0 1 1150 648"/>
        </g>
      </svg>

      <div class="c2-join__left">
        <p class="c2-join__eyebrow">{{CTA_EYEBROW}}</p>
        <h2 class="c2-join__title" id="cta-join-title">{{CTA_TITLE}}</h2>
        <p class="c2-join__lead">{{CTA_LEAD}}</p>
        <div class="ca-join__actions">
          <a class="c2-btn c2-btn--green" href="{{CTA_BTN1_HREF}}">{{CTA_BTN1}}</a>
          <a class="c2-btn c2-btn--quiet" href="{{CTA_BTN2_HREF}}">{{CTA_BTN2}}</a>
        </div>
        <!-- The programme list, quietly, under the buttons, Ayna asked for it
             "very subtly". Hardcoded rather than another @var: it is the same
             five programmes on every page that carries this card. -->
        <p class="c2-join__progs">Infant &middot; Toddler &middot; 2K &middot; NYC 3-K &middot; Summer Camp</p>
      </div>

      <div class="c2-join__right" id="contact">
        <div class="c2-join__contacts">
          <div class="c2-join__item">
            <span class="c2-join__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.4"/><path d="M3.2 6.6l8.8 6.2 8.8-6.2"/></svg>
            </span>
            <span>
              <span class="c2-join__label">Write us a message</span>
              <a class="c2-join__value" href="mailto:customerservice@cuddleavenue.org">customerservice@<wbr>cuddleavenue.org
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </a>
            </span>
          </div>

          <div class="c2-join__item">
            <span class="c2-join__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.4 3.6l2.5 4-2 1.7a11.6 11.6 0 0 0 4.8 4.8l1.7-2 4 2.5-1.1 3.3a1.6 1.6 0 0 1-1.8 1.1C10.4 18.1 5.9 13.6 4.2 6.5a1.6 1.6 0 0 1 1.1-1.8z"/></svg>
            </span>
            <span>
              <span class="c2-join__label">Give us a call</span>
              <a class="c2-join__value" href="tel:+18006204221">(800)&nbsp;620&#8209;4221
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </a>
            </span>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
