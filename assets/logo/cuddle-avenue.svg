<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 112" role="img" aria-label="Cuddle Avenue Academy, Brooklyn">
  <title>Cuddle Avenue Academy</title>
  <desc>Two cuddling bear cubs beside the Cuddle Avenue Academy wordmark</desc>

  <!-- ─────────── hearts ─────────── -->
  <g fill="#A78BFA">
    <path d="M26 20c-1.7-2.8-6-2.4-6 1.1 0 2.6 3.4 5 6 6.9 2.6-1.9 6-4.3 6-6.9 0-3.5-4.3-3.9-6-1.1Z" opacity=".9"/>
    <path d="M44 8c-1.3-2.1-4.6-1.8-4.6.9 0 2 2.7 3.8 4.6 5.3 2-1.5 4.6-3.3 4.6-5.3 0-2.7-3.3-3-4.6-.9Z" opacity=".62"/>
    <path d="M12 36c-1-1.7-3.7-1.5-3.7.7 0 1.6 2.2 3.1 3.7 4.3 1.6-1.2 3.7-2.7 3.7-4.3 0-2.2-2.7-2.4-3.7-.7Z" opacity=".42"/>
  </g>

  <!-- ═══════════ BIG BEAR — marigold, sits behind on the right ═══════════ -->
  <g transform="translate(102 60)" stroke="#2F5D50" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears -->
    <circle cx="-20" cy="-30" r="10.5" fill="#F2C14E"/>
    <circle cx="20"  cy="-30" r="10.5" fill="#F2C14E"/>
    <circle cx="-20" cy="-30" r="4.6"  fill="#E8A7A0" stroke="none" opacity=".5"/>
    <circle cx="20"  cy="-30" r="4.6"  fill="#E8A7A0" stroke="none" opacity=".5"/>
    <!-- left arm, reaching around the little one -->
    <path d="M-24-4c-9 2-15 9-14 16 1 6 7 9 14 8" fill="#F2C14E"/>
    <!-- body -->
    <path fill="#F2C14E" d="M-22-18c0-10 10-15 22-15s22 5 22 15c8 8 10 20 10 28 0 16-14 24-32 24s-32-8-32-24c0-8 2-20 10-28Z"/>
    <!-- feet -->
    <ellipse cx="-15" cy="29" rx="9"   ry="5.6" fill="#F2C14E"/>
    <ellipse cx="15"  cy="29" rx="9"   ry="5.6" fill="#F2C14E"/>
    <!-- muzzle -->
    <ellipse cx="0" cy="7" rx="12.5" ry="9.5" fill="#FDF5E6"/>
    <!-- eyes -->
    <circle cx="-11.5" cy="-7" r="2.9" fill="#2F5D50" stroke="none"/>
    <circle cx="11.5"  cy="-7" r="2.9" fill="#2F5D50" stroke="none"/>
    <!-- nose + smile -->
    <ellipse cx="0" cy="2.5" rx="3.2" ry="2.4" fill="#2F5D50" stroke="none"/>
    <path d="M0 5v2.6M0 7.6c0 2.4-2 3.8-3.9 3.8M0 7.6c0 2.4 2 3.8 3.9 3.8" fill="none" stroke-width="2.5"/>
    <!-- blush -->
    <ellipse cx="-22" cy="4" rx="5"  ry="3.2" fill="#E8A7A0" stroke="none" opacity=".55"/>
    <ellipse cx="22"  cy="4" rx="5"  ry="3.2" fill="#E8A7A0" stroke="none" opacity=".55"/>
  </g>

  <!-- ═══════════ SMALL BEAR — cream, tucked in front on the left ═══════════ -->
  <g transform="translate(48 74) scale(.66)" stroke="#2F5D50" stroke-width="5.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-20" cy="-30" r="10.5" fill="#EAE2CB"/>
    <circle cx="20"  cy="-30" r="10.5" fill="#EAE2CB"/>
    <circle cx="-20" cy="-30" r="4.6"  fill="#E8A7A0" stroke="none" opacity=".5"/>
    <circle cx="20"  cy="-30" r="4.6"  fill="#E8A7A0" stroke="none" opacity=".5"/>
    <path fill="#EAE2CB" d="M-22-18c0-10 10-15 22-15s22 5 22 15c8 8 10 20 10 28 0 16-14 24-32 24s-32-8-32-24c0-8 2-20 10-28Z"/>
    <ellipse cx="-15" cy="29" rx="9" ry="5.6" fill="#EAE2CB"/>
    <ellipse cx="15"  cy="29" rx="9" ry="5.6" fill="#EAE2CB"/>
    <ellipse cx="0" cy="7" rx="12.5" ry="9.5" fill="#FDF5E6"/>
    <circle cx="-11.5" cy="-7" r="2.9" fill="#2F5D50" stroke="none"/>
    <circle cx="11.5"  cy="-7" r="2.9" fill="#2F5D50" stroke="none"/>
    <ellipse cx="0" cy="2.5" rx="3.2" ry="2.4" fill="#2F5D50" stroke="none"/>
    <path d="M0 5v2.6M0 7.6c0 2.4-2 3.8-3.9 3.8M0 7.6c0 2.4 2 3.8 3.9 3.8" fill="none" stroke-width="3.6"/>
    <ellipse cx="-22" cy="4" rx="5" ry="3.2" fill="#E8A7A0" stroke="none" opacity=".55"/>
    <ellipse cx="22"  cy="4" rx="5" ry="3.2" fill="#E8A7A0" stroke="none" opacity=".55"/>
  </g>

  <!-- ═══════════ WORDMARK ═══════════ -->
  <text x="152" y="58" fill="#2F5D50" font-family="Grandstander, 'Trebuchet MS', sans-serif"
        font-weight="800" font-size="30" letter-spacing="-.3">Cuddle Avenue</text>
  <text x="154" y="79" fill="#2F5D50" font-family="'Nunito Sans', system-ui, sans-serif"
        font-weight="700" font-size="10" letter-spacing="4.4" opacity=".7">ACADEMY · BROOKLYN</text>
</svg>
